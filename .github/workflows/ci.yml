name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check app.py streamlit_app.py main.py auth components core database migrations modules pages tasks tests utils --select E,W,F --ignore E501

      - name: Syntax check
        run: |
          python -m compileall -q app.py main.py auth components core database modules pages tasks utils tests

      - name: Type check security and input boundaries
        run: pyright

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: "test-key-for-ci"
          JWT_SECRET_KEY: "ci-only-secret-key-that-is-longer-than-32-characters"
          DATABASE_URL: "sqlite:////tmp/ssm-ci.db"

      - name: Audit production dependencies
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --provenance=true --sbom=true --build-arg APP_VERSION="$GITHUB_SHA" --build-arg VCS_REF="$GITHUB_SHA" -t "smart-stock-monitor:$GITHUB_SHA" .

      - name: Test complete Compose stack
        run: |
          export PG_PASSWORD="ci-only-database-password"
          export JWT_SECRET_KEY="ci-only-secret-key-that-is-longer-than-32-characters"
          export APP_VERSION="$GITHUB_SHA"
          export APP_PORT="8501"
          docker compose up -d --no-build
          healthy=0
          for attempt in $(seq 1 30); do
            web_status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q stock-monitor)" 2>/dev/null || echo starting)
            worker_status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q worker)" 2>/dev/null || echo starting)
            beat_status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q beat)" 2>/dev/null || echo starting)
            if [ "$web_status" = healthy ] && [ "$worker_status" = healthy ] && [ "$beat_status" = healthy ] && curl -fsS http://localhost:8501/_stcore/health; then
              healthy=1
              break
            fi
            sleep 5
          done
          docker compose ps
          if [ "$healthy" -ne 1 ]; then
            docker compose logs --no-color
            docker compose down -v
            exit 1
          fi
          docker compose down -v
